<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (cambio(); as cambioRef) {
      <div>
        <h2 data-cy="cambioDetailsHeading"><span jhiTranslate="oncallApp.cambio.detail.title">Cambio</span></h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ cambioRef.id }}</span>
          </dd>
          <dt><span jhiTranslate="oncallApp.cambio.titulo">Titulo</span></dt>
          <dd>
            <span>{{ cambioRef.titulo }}</span>
          </dd>
          <dt><span jhiTranslate="oncallApp.cambio.descripcion">Descripcion</span></dt>
          <dd>
            <span>{{ cambioRef.descripcion }}</span>
          </dd>
          <dt><span jhiTranslate="oncallApp.cambio.ticketUrl">Ticket Url</span></dt>
          <dd>
            <span>{{ cambioRef.ticketUrl }}</span>
          </dd>
          <dt><span jhiTranslate="oncallApp.cambio.creadoEn">Creado En</span></dt>
          <dd>
            <span>{{ cambioRef.creadoEn | formatMediumDatetime }}</span>
          </dd>
          <dt><span jhiTranslate="oncallApp.cambio.autor">Autor</span></dt>
          <dd>
            <span>{{ cambioRef.autor?.login }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Volver</span>
        </button>

        <button type="button" [routerLink]="['/cambio', cambioRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Editar</span>
        </button>
      </div>
    }
  </div>
</div>
